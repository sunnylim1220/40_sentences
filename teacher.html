<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>40문장 — 교사 대시보드</title>
<style>
:root{
  --bg:#0f172a;--card:#1e293b;--card2:#162032;--text:#f1f5f9;--muted:#94a3b8;
  --line:#334155;--accent:#f97316;--success:#22c55e;--danger:#ef4444;--warn:#f59e0b;
  --shadow:0 12px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;line-height:1.5}
button,input,select{font:inherit}
.hidden{display:none!important}

/* TOP */
.top-bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 24px;background:rgba(15,23,42,.95);border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px)}
.top-bar h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em}
.top-bar span{font-size:12px;color:var(--muted);margin-left:8px}
.btn{border:1px solid var(--line);border-radius:999px;padding:8px 16px;background:var(--card);
  color:var(--text);cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#ea6c00}

/* MAIN */
main{width:min(1280px,calc(100%-32px));margin:24px auto;padding-bottom:80px}

/* CONFIG CARD */
.config-card{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:24px;margin-bottom:24px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.config-card label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.config-input{background:#0f172a;border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;color:var(--text);font-size:13px;outline:none;width:320px;max-width:100%}
.config-input:focus{border-color:var(--accent)}

/* STAT ROW */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:20px;text-align:center}
.stat-val{font-size:clamp(28px,4vw,44px);font-weight:700;letter-spacing:-.04em}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px}

/* PANELS */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel-title{font-size:14px;font-weight:600;margin:0 0 16px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

/* BAR */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{font-size:12px;color:var(--text);min-width:80px;text-align:right}
.bar-track{flex:1;background:#1e293b;border:1px solid var(--line);border-radius:999px;height:16px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--accent);transition:width .5s}
.bar-fill.ok{background:var(--success)}
.bar-fill.mid{background:var(--warn)}
.bar-val{font-size:12px;color:var(--muted);min-width:32px;text-align:right}

/* STUDENT TABLE */
.student-table-wrap{overflow-x:auto}
.student-table{width:100%;border-collapse:collapse;font-size:13px}
.student-table th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);
  color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.04em}
.student-table td{padding:10px 12px;border-bottom:1px solid rgba(51,65,85,.5)}
.student-table tr:hover td{background:rgba(249,115,22,.05)}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600}
.badge.hot{background:rgba(239,68,68,.15);color:var(--danger)}
.badge.ok{background:rgba(34,197,94,.15);color:var(--success)}
.badge.mid{background:rgba(245,158,11,.15);color:var(--warn)}

/* WRONG ITEMS */
.wrong-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(51,65,85,.4)}
.wrong-item:last-child{border-bottom:none}
.wi-rank{min-width:28px;height:28px;border-radius:999px;background:rgba(239,68,68,.15);color:var(--danger);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.wi-body{flex:1;min-width:0}
.wi-q{font-size:13px;word-break:keep-all}
.wi-meta{font-size:11px;color:var(--muted);margin-top:2px}

/* FULL TABLE */
.full-table-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.table-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.filter-select{background:#0f172a;border:1px solid var(--line);border-radius:10px;padding:7px 10px;
  color:var(--text);font-size:13px;outline:none;cursor:pointer}
.filter-select:focus{border-color:var(--accent)}
.search-input{background:#0f172a;border:1px solid var(--line);border-radius:10px;padding:7px 12px;
  color:var(--text);font-size:13px;outline:none;width:180px}
.search-input:focus{border-color:var(--accent)}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);
  color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.data-table td{padding:9px 12px;border-bottom:1px solid rgba(51,65,85,.4)}
.data-table tr:hover td{background:rgba(249,115,22,.04)}
.correct-dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.correct-dot.ok{background:var(--success)}
.correct-dot.ng{background:var(--danger)}
.pagination{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.page-btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;
  color:var(--muted);cursor:pointer;font-size:12px}
.page-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.page-btn:hover:not(.active){border-color:var(--accent);color:var(--accent)}

/* LOADING */
#loadingOverlay{position:fixed;inset:0;background:rgba(15,23,42,.9);z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingMsg{color:var(--muted);font-size:14px}

@media(max-width:900px){
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .panels{grid-template-columns:1fr}
  .config-input{width:100%}
}
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingMsg">데이터를 불러오는 중...</div>
</div>

<div class="top-bar">
  <div><h1>📊 40문장 교사 대시보드<span id="lastUpdated"></span></h1></div>
  <div style="display:flex;gap:8px">
    <button class="btn primary" id="refreshBtn" type="button">↻ 새로고침</button>
    <button class="btn" id="exportBtn" type="button">CSV 내보내기</button>
  </div>
</div>

<main>
  <!-- CONFIG -->
  <div class="config-card">
    <div>
      <label>Apps Script URL</label>
      <input class="config-input" id="scriptUrlInput" type="text" placeholder="https://script.google.com/macros/s/.../exec"/>
    </div>
    <button class="btn primary" id="loadBtn" type="button">불러오기</button>
  </div>

  <!-- STATS -->
  <div class="stat-row" id="statRow">
    <div class="stat-card"><div class="stat-val" id="sTotal">—</div><div class="stat-label">전체 응시 기록</div></div>
    <div class="stat-card"><div class="stat-val" id="sStudents">—</div><div class="stat-label">학생 수</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--success)" id="sRate">—</div><div class="stat-label">전체 정답률</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--danger)" id="sWrong">—</div><div class="stat-label">총 오답 수</div></div>
  </div>

  <!-- PANELS -->
  <div class="panels">
    <!-- 단원별 -->
    <div class="panel">
      <div class="panel-title">단원별 정답률</div>
      <div id="unitPanel"></div>
    </div>
    <!-- 자주 틀린 문제 -->
    <div class="panel">
      <div class="panel-title">학급 공통 오답 TOP 15</div>
      <div id="wrongPanel"></div>
    </div>
  </div>

  <!-- 학생별 -->
  <div class="full-table-card" style="margin-bottom:24px">
    <div class="table-header">
      <div class="panel-title" style="margin:0">학생별 성적 요약</div>
    </div>
    <div class="student-table-wrap">
      <table class="student-table" id="studentTable">
        <thead><tr>
          <th>이름</th><th>응시 횟수</th><th>총 문제</th><th>정답률</th><th>오답 수</th><th>마지막 응시</th>
        </tr></thead>
        <tbody id="studentBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 전체 기록 -->
  <div class="full-table-card">
    <div class="table-header">
      <div class="panel-title" style="margin:0">전체 기록</div>
      <div class="filter-row">
        <input class="search-input" id="searchInput" type="text" placeholder="학생 이름 검색"/>
        <select class="filter-select" id="filterStudent"><option value="">전체 학생</option></select>
        <select class="filter-select" id="filterUnit"><option value="">전체 단원</option></select>
        <select class="filter-select" id="filterCorrect">
          <option value="">정오 전체</option>
          <option value="O">정답만</option>
          <option value="X">오답만</option>
        </select>
      </div>
    </div>
    <div style="overflow-x:auto">
      <table class="data-table">
        <thead><tr>
          <th>시각</th><th>학생</th><th>단원</th><th>세트</th><th>문제</th><th>입력</th><th>정오</th>
        </tr></thead>
        <tbody id="recordsBody"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>
</main>

<script>
let allRecords = [];
let filteredRecords = [];
let currentPage = 1;
const PAGE_SIZE = 50;

const els = {
  loadingOverlay: document.getElementById('loadingOverlay'),
  loadingMsg: document.getElementById('loadingMsg'),
  lastUpdated: document.getElementById('lastUpdated'),
  scriptUrlInput: document.getElementById('scriptUrlInput'),
  loadBtn: document.getElementById('loadBtn'),
  refreshBtn: document.getElementById('refreshBtn'),
  exportBtn: document.getElementById('exportBtn'),
  searchInput: document.getElementById('searchInput'),
  filterStudent: document.getElementById('filterStudent'),
  filterUnit: document.getElementById('filterUnit'),
  filterCorrect: document.getElementById('filterCorrect'),
};

// Restore saved URL
const savedUrl = localStorage.getItem('teacherScriptUrl') || '';
if (savedUrl) els.scriptUrlInput.value = savedUrl;

async function loadRecords() {
  const url = els.scriptUrlInput.value.trim();
  if (!url) { alert('Apps Script URL을 입력하세요.'); return; }
  localStorage.setItem('teacherScriptUrl', url);
  els.loadingOverlay.style.display = 'flex';
  els.loadingMsg.textContent = '기록 데이터를 불러오는 중...';

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allRecords = await res.json();
    els.lastUpdated.textContent = ` · ${new Date().toLocaleTimeString('ko-KR')} 기준`;
    renderAll();
  } catch(e) {
    alert('로딩 실패: ' + e.message + '\nApps Script URL과 배포 설정을 확인하세요.');
  } finally {
    els.loadingOverlay.style.display = 'none';
  }
}

function renderAll() {
  renderStats();
  renderUnitPanel();
  renderWrongPanel();
  renderStudentTable();
  buildFilters();
  applyFilters();
}

function renderStats() {
  const total = allRecords.length;
  const students = new Set(allRecords.map(r => r.studentName)).size;
  const correct = allRecords.filter(r => r.correct === 'O' || r.correct === true).length;
  const wrong = total - correct;
  const rate = total ? Math.round(correct / total * 100) : 0;

  document.getElementById('sTotal').textContent = total.toLocaleString();
  document.getElementById('sStudents').textContent = students;
  document.getElementById('sRate').textContent = rate + '%';
  document.getElementById('sWrong').textContent = wrong.toLocaleString();
}

function formatTestId(id) {
  return String(id || '').replace(/^(문장\s*)(\d+)$/, (_, p, n) => p + String(n).padStart(2, '0'));
}

function renderUnitPanel() {
  const unitMap = {};
  allRecords.forEach(r => {
    const u = formatTestId(r.testId || '기타');
    if (!unitMap[u]) unitMap[u] = { correct: 0, total: 0 };
    unitMap[u].total++;
    if (r.correct === 'O' || r.correct === true) unitMap[u].correct++;
  });

  const html = Object.entries(unitMap)
    .sort((a,b) => (a[1].correct/a[1].total) - (b[1].correct/b[1].total))
    .map(([name, stat]) => {
      const pct = Math.round(stat.correct / stat.total * 100);
      const cls = pct >= 70 ? 'ok' : pct >= 50 ? 'mid' : '';
      return `<div class="bar-row">
        <div class="bar-label">${esc(name)}</div>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
        <div class="bar-val">${pct}%</div>
      </div>`;
    }).join('');
  document.getElementById('unitPanel').innerHTML = html || '<div style="color:var(--muted);font-size:13px">데이터 없음</div>';
}

function renderWrongPanel() {
  const wrongMap = {};
  allRecords.filter(r => r.correct === 'X' || r.correct === false).forEach(r => {
    const k = r.question || '';
    if (!wrongMap[k]) wrongMap[k] = { q: k, testId: r.testId, count: 0, students: new Set() };
    wrongMap[k].count++;
    wrongMap[k].students.add(r.studentName);
  });

  const sorted = Object.values(wrongMap).sort((a,b) => b.count - a.count).slice(0, 15);
  const html = sorted.map((item, i) => `
    <div class="wrong-item">
      <div class="wi-rank">${i+1}</div>
      <div class="wi-body">
        <div class="wi-q">${esc(item.q)}</div>
        <div class="wi-meta">${esc(item.testId||'')} · ${item.count}회 오답 · ${item.students.size}명</div>
      </div>
    </div>`).join('');
  document.getElementById('wrongPanel').innerHTML = html || '<div style="color:var(--muted);font-size:13px">오답 데이터 없음</div>';
}

function renderStudentTable() {
  const studentMap = {};
  allRecords.forEach(r => {
    const n = r.studentName || '(익명)';
    if (!studentMap[n]) studentMap[n] = { name: n, sessions: new Set(), total: 0, correct: 0, lastDate: '' };
    studentMap[n].total++;
    if (r.correct === 'O' || r.correct === true) studentMap[n].correct++;
    const day = (r.timestamp || '').slice(0, 10);
    if (day > studentMap[n].lastDate) studentMap[n].lastDate = day;
    studentMap[n].sessions.add((r.timestamp || '').slice(0,10) + '_' + r.testId);
  });

  const rows = Object.values(studentMap).sort((a,b) => {
    const ra = a.correct/a.total, rb = b.correct/b.total;
    return ra - rb;
  });

  const tbody = document.getElementById('studentBody');
  tbody.innerHTML = rows.map(s => {
    const rate = Math.round(s.correct / s.total * 100);
    const wrong = s.total - s.correct;
    const cls = rate >= 70 ? 'ok' : rate >= 50 ? 'mid' : 'hot';
    return `<tr>
      <td><strong>${esc(s.name)}</strong></td>
      <td>${s.sessions.size}</td>
      <td>${s.total}</td>
      <td><span class="badge ${cls}">${rate}%</span></td>
      <td style="color:var(--danger)">${wrong}</td>
      <td style="color:var(--muted)">${s.lastDate}</td>
    </tr>`;
  }).join('');
}

function buildFilters() {
  const students = [...new Set(allRecords.map(r => r.studentName).filter(Boolean))].sort();
  const units = [...new Set(allRecords.map(r => r.testId).filter(Boolean))].sort();

  els.filterStudent.innerHTML = '<option value="">전체 학생</option>' +
    students.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  els.filterUnit.innerHTML = '<option value="">전체 단원</option>' +
    units.map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join('');
}

function applyFilters() {
  const search = els.searchInput.value.toLowerCase();
  const student = els.filterStudent.value;
  const unit = els.filterUnit.value;
  const correct = els.filterCorrect.value;

  filteredRecords = allRecords.filter(r => {
    if (search && !(r.studentName || '').toLowerCase().includes(search)) return false;
    if (student && r.studentName !== student) return false;
    if (unit && r.testId !== unit) return false;
    if (correct && r.correct !== correct) return false;
    return true;
  });

  currentPage = 1;
  renderTable();
}

function renderTable() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = filteredRecords.slice(start, start + PAGE_SIZE);

  document.getElementById('recordsBody').innerHTML = page.map(r => {
    const isCorrect = r.correct === 'O' || r.correct === true;
    return `<tr>
      <td style="color:var(--muted);font-size:11px">${esc((r.timestamp||'').replace('T',' ').slice(0,16))}</td>
      <td>${esc(r.studentName||'')}</td>
      <td>${esc(r.testId||'')}</td>
      <td style="color:var(--muted)">${esc(r.setId||'')}</td>
      <td>${esc(r.question||'')}</td>
      <td style="color:var(--muted)">${esc(r.userAnswer||'')}</td>
      <td><span class="correct-dot ${isCorrect?'ok':'ng'}"></span></td>
    </tr>`;
  }).join('');

  renderPagination();
}

function renderPagination() {
  const total = Math.ceil(filteredRecords.length / PAGE_SIZE);
  if (total <= 1) { document.getElementById('pagination').innerHTML = ''; return; }

  let html = '';
  for (let i = 1; i <= Math.min(total, 20); i++) {
    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
  }
  if (total > 20) html += `<span style="color:var(--muted);font-size:12px;align-self:center">… ${total}페이지</span>`;
  document.getElementById('pagination').innerHTML = html;
  document.querySelectorAll('.page-btn').forEach(btn => {
    btn.addEventListener('click', () => { currentPage = Number(btn.dataset.page); renderTable(); });
  });
}

function exportCSV() {
  if (!allRecords.length) { alert('데이터가 없습니다.'); return; }
  const headers = ['timestamp','studentName','testId','setId','question','userAnswer','correct'];
  const rows = [headers, ...allRecords.map(r => headers.map(h => String(r[h]||'').replace(/,/g,'，')))];
  const csv = '\uFEFF' + rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `40sentences_records_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function esc(v) {
  return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Events
els.loadBtn.onclick = loadRecords;
els.refreshBtn.onclick = loadRecords;
els.exportBtn.onclick = exportCSV;
els.searchInput.oninput = applyFilters;
els.filterStudent.onchange = applyFilters;
els.filterUnit.onchange = applyFilters;
els.filterCorrect.onchange = applyFilters;

// Auto-load if URL saved
els.loadingOverlay.style.display = 'none';
if (savedUrl) loadRecords();
</script>
</body>
</html>
